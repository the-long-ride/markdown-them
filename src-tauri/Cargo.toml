[package]
name = "markdown-them"
version = "1.4.0"
description = "Markdown Them - Local Desktop Document to Markdown Converter"
authors = ["the-long-ride <thelong1406@gmail.com>"]
edition = "2021"
license = "MIT"

[lib]
name = "markdown_them_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "sync", "rt-multi-thread"] }
walkdir = "2.5"
open = "5.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
