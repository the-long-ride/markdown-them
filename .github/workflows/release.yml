name: Build & Release

on:
  push:
    tags:
      - "v*"

jobs:
  detect-changes:
    name: Detect Changed Variants
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      desktop: ${{ steps.variants.outputs.desktop }}
      node: ${{ steps.variants.outputs.node }}
      vsix: ${{ steps.variants.outputs.vsix }}
      web: ${{ steps.variants.outputs.web }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed release variants
        id: variants
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${GITHUB_REF_NAME}"
          base_tag=""
          while IFS= read -r tag; do
            if [ "$tag" != "$current_tag" ]; then
              base_tag="$tag"
              break
            fi
          done < <(git tag --merged HEAD --sort=-version:refname)

          if [ -z "$base_tag" ]; then
            echo "__all__" > changed-files.txt
            echo "No earlier tag found; all release variants will run."
          else
            git diff --name-only "$base_tag"..HEAD > changed-files.txt
            echo "Comparing $base_tag..HEAD"
          fi

          cat changed-files.txt

          matches() {
            local pattern="$1"
            if grep -qx "__all__" changed-files.txt; then
              return 0
            fi
            grep -Eq "$pattern" changed-files.txt
          }

          set_variant() {
            local name="$1"
            local pattern="$2"
            local value="false"
            if matches "$pattern"; then
              value="true"
            fi
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_OUTPUT"
            printf -v "$name" '%s' "$value"
            echo "$name: $value"
          }

          set_variant "vsix" '^(\.github/workflows/release\.yml|package(-lock)?\.json|README\.md|CHANGELOG\.md|LICENSE|assets/|src/vscode/|src/extension\.ts|src/converters\.ts|src/core/|src/shared/|src/polyfill\.ts|tsconfig\.json)'
          set_variant "node" '^(\.github/workflows/release\.yml|package(-lock)?\.json|nodejs-package/|src/nodejs-package/|src/core/|src/shared/|tsconfig\.node-package\.json)'
          set_variant "web" '^(\.github/workflows/release\.yml|package(-lock)?\.json|assets/|src/app/|src/core/|src/shared/|scripts/(build-apps|start-web)\.mjs|tsconfig\.app\.json)'
          set_variant "desktop" '^(\.github/workflows/release\.yml|package(-lock)?\.json|electron-builder\.json|assets/|src/app/|src/core/|src/electron/|src/shared/|scripts/build-apps\.mjs|tsconfig\.app\.json)'

          {
            echo "### Changed release variants"
            echo
            if [ -n "$base_tag" ]; then
              echo "Compared against \`$base_tag\`."
            else
              echo "No earlier tag found, so every variant is enabled."
            fi
            echo
            echo "- VSIX: $vsix"
            echo "- Node package: $node"
            echo "- Web app: $web"
            echo "- Desktop app: $desktop"
          } >> "$GITHUB_STEP_SUMMARY"

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.vsix == 'true'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync package.json version with tag
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Package extension
        run: npm run pack:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-them-vsix-${{ steps.get_version.outputs.version }}
          path: "*.vsix"

  publish-extension:
    name: Publish VS Code Extension
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-vsix
    if: needs.detect-changes.outputs.vsix == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download VSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: markdown-them-vsix-${{ steps.get_version.outputs.version }}
          path: ./artifacts

      - name: Publish to VS Code Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -n "$VSCE_PAT" ]; then
            VSCE_LOG="$(mktemp)"
            set +e
            npx @vscode/vsce publish --packagePath ./artifacts/*.vsix -p "$VSCE_PAT" 2>&1 | tee "$VSCE_LOG"
            VSCE_STATUS=${PIPESTATUS[0]}
            set -e

            if [ "$VSCE_STATUS" -ne 0 ]; then
              if grep -Eiq '(^|[[:space:]])PUT([[:space:]]|$)' "$VSCE_LOG" && grep -Eiq 'same or lower|lower than|not greater|greater than|already (exists|published)|version.*published|version.*marketplace' "$VSCE_LOG"; then
                echo "::warning::Skipping VS Code Marketplace publish because this extension version is already published or not greater than the Marketplace version."
              else
                exit "$VSCE_STATUS"
              fi
            fi
          else
            echo "Skipping VS Code Marketplace publish (VSCE_PAT is not set)"
          fi

      - name: Publish to Open VSX Registry
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx ovsx publish ./artifacts/*.vsix -p "$OVSX_PAT"
          else
            echo "Skipping Open VSX publish (OVSX_PAT is not set)"
          fi

  build-node-package:
    name: Build Node Package
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.node == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync package versions with tag
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version --prefix ./nodejs-package

      - name: Pack node package
        run: npm run pack:node-package

      - name: Upload node package artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-them-node-package-${{ steps.get_version.outputs.version }}
          path: ./artifacts/*.tgz

  publish-node-package:
    name: Publish Node Package to npm
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-node-package
    if: needs.detect-changes.outputs.node == 'true'
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Check npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "Missing repository secret: NPM_TOKEN"
            exit 1
          fi

      - name: Download node package artifact
        uses: actions/download-artifact@v8
        with:
          pattern: markdown-them-node-package-*
          path: ./artifacts
          merge-multiple: true

      - name: Publish package tarball
        run: npm publish ./artifacts/*.tgz --access public

  deploy-web:
    name: Deploy Web App to GitHub Pages
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Sync package version with tag
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Build web app
        run: npm run build:web

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  build-desktop:
    name: Build Desktop App
    runs-on: ${{ matrix.os }}
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        shell: bash

      - name: Sync package version with tag
        run: |
          npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version
        shell: bash

      - name: Build and Package Desktop App (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:desktop:win

      - name: Build and Package Desktop App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:desktop:linux

      - name: Build and Package Desktop App (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:desktop:mac

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-installers-${{ matrix.os }}
          path: dist/installers/*

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - build-vsix
      - build-node-package
      - build-desktop
    if: >
      always() &&
      (needs.detect-changes.outputs.vsix == 'true' || needs.detect-changes.outputs.node == 'true' || needs.detect-changes.outputs.desktop == 'true') &&
      (needs.detect-changes.outputs.vsix != 'true' || needs.build-vsix.result == 'success') &&
      (needs.detect-changes.outputs.node != 'true' || needs.build-node-package.result == 'success') &&
      (needs.detect-changes.outputs.desktop != 'true' || needs.build-desktop.result == 'success')
    permissions:
      contents: write

    steps:
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download VSIX artifact
        if: needs.detect-changes.outputs.vsix == 'true'
        uses: actions/download-artifact@v8
        with:
          name: markdown-them-vsix-${{ steps.get_version.outputs.version }}
          path: ./release-assets

      - name: Download node package artifact
        if: needs.detect-changes.outputs.node == 'true'
        uses: actions/download-artifact@v8
        with:
          name: markdown-them-node-package-${{ steps.get_version.outputs.version }}
          path: ./release-assets

      - name: Download Desktop installers
        if: needs.detect-changes.outputs.desktop == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-installers-*
          path: ./release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Markdown Them Release [${{ github.ref_name }}](https://github.com/the-long-ride/markdown-them/blob/main/CHANGELOG.md)
            
            Choose the file that matches how you want to install Markdown Them:
            
            * [`.vsix`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/the-long-ride.markdown-them-${{ steps.get_version.outputs.version }}.vsix) : VS Code extension package for manual install. In VS Code, run "Extensions: Install from VSIX..." and choose this file.
            * [`.exe`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/markdown-them-${{ steps.get_version.outputs.version }}-windows-portable.exe) : Windows portable desktop app. Download and run directly.
            * [`.AppImage`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/markdown-them-${{ steps.get_version.outputs.version }}-linux.AppImage) : Linux portable desktop app. Mark it executable, then run it.
            * [`.deb`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/markdown-them-${{ steps.get_version.outputs.version }}-linux.deb) : Linux installer for Debian, Ubuntu, and compatible distributions.
            * [`.dmg`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/markdown-them-${{ steps.get_version.outputs.version }}-mac.dmg) : macOS desktop installer.
            * [`.zip`](https://github.com/the-long-ride/markdown-them/releases/download/${{ github.ref_name }}/markdown-them-${{ steps.get_version.outputs.version }}-mac.zip) : macOS archive build.
            
            ### Other Install Links
            * **VS Code Marketplace:** https://marketplace.visualstudio.com/items?itemName=the-long-ride.markdown-them
            * **Open VSX:** https://open-vsx.org/extension/the-long-ride/markdown-them
            * **Project Website:** https://the-long-ride.github.io/markdown-them/
            
            For a list of changes in this release, see the [CHANGELOG.md](https://github.com/the-long-ride/markdown-them/blob/main/CHANGELOG.md).
          files: |
            ./release-assets/*.vsix
            ./release-assets/*.tgz
            ./release-assets/*.exe
            ./release-assets/*.AppImage
            ./release-assets/*.deb
            ./release-assets/*.dmg
            ./release-assets/*.zip
