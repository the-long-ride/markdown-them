name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run pack:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v6
        with:
          name: markdown-them-vsix
          path: '*.vsix'

  build-node-package:
    name: Build Node Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack node package
        run: npm run pack:node-package

      - name: Upload node package artifact
        uses: actions/upload-artifact@v6
        with:
          name: markdown-them-node-package
          path: ./artifacts/*.tgz

  verify-apps:
    name: Verify Apps & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 build-essential curl wget file libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Verify Web App Build
        run: npm run build:web

      - name: Build Node Package
        run: npm run build:node-package

      - name: Run Unified Test Suite (Format, Types, LOC, Rust, Coverage)
        run: npm test
