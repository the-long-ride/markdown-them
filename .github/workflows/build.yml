name: Build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Prettier check
        run: npx prettier --check .

      - name: LOC lint
        run: npm run lint:loc

      - name: Cargo format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test CJK font coverage
        run: node --test tests/cjk-fonts.test.mjs

      - name: Test release metadata and SEO smoke
        run: node --test tests/release-contributors.test.mjs tests/seo-smoke.test.mjs

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck apps
        run: npm run typecheck:apps

      - name: Compile core and extension
        run: npm run compile

      - name: Build node package
        run: npm run build:node-package

  rust:
    name: Rust Coverage
    runs-on: ubuntu-latest
    env:
      RUST_COVERAGE_MIN: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 build-essential curl wget file libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage summary
        shell: bash
        run: |
          set -euo pipefail

          cargo llvm-cov --manifest-path src-tauri/Cargo.toml \
            --ignore-filename-regex '/src-tauri/src/(main|lib|commands/native_dialogs)\.rs$' \
            --summary-only 2>&1 | tee rust-coverage.txt

          total_line=$(grep '^TOTAL' rust-coverage.txt | tail -n 1 || true)
          if [[ -z "$total_line" ]]; then
            echo "FAIL: Unable to parse coverage: no TOTAL row found"
            exit 1
          fi

          pct=$(awk '{print $10}' <<< "$total_line" | tr -d '%')
          if ! [[ "$pct" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "FAIL: Unable to parse line coverage from TOTAL row: $total_line"
            exit 1
          fi
          if ! [[ "$RUST_COVERAGE_MIN" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "FAIL: RUST_COVERAGE_MIN is not numeric: $RUST_COVERAGE_MIN"
            exit 1
          fi

          echo "=== Total line coverage: ${pct}% ==="
          if awk -v pct="$pct" -v min="$RUST_COVERAGE_MIN" 'BEGIN { exit !(pct + 0 < min + 0) }'; then
            echo "FAIL: Coverage ${pct}% is below ${RUST_COVERAGE_MIN}% threshold"
            exit 1
          fi
          echo "PASS: Coverage ${pct}% meets ${RUST_COVERAGE_MIN}% threshold"

      - name: Export LCOV report
        run: |
          cargo llvm-cov report --manifest-path src-tauri/Cargo.toml \
            --ignore-filename-regex '/src-tauri/src/(main|lib|commands/native_dialogs)\.rs$' \
            --lcov --output-path rust-lcov.info

      - name: Upload Rust coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          path: rust-lcov.info
          if-no-files-found: error

  coverage:
    name: TypeScript Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile core and extension
        run: npm run compile

      - name: Run coverage for all TypeScript variants
        run: node scripts/test-coverage.mjs

      - name: Upload TypeScript coverage artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: typescript-coverage
          path: |
            coverage/coverage-summary.json
            coverage/lcov.info
          if-no-files-found: error

  web:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build:web

  build-vsix:
    name: Build VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package extension
        run: npm run pack:vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-them-vsix
          path: '*.vsix'

  build-node-package:
    name: Build Node Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Pack node package
        run: npm run pack:node-package

      - name: Upload node package artifact
        uses: actions/upload-artifact@v7
        with:
          name: markdown-them-node-package
          path: ./artifacts/*.tgz

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - typecheck
      - rust
      - coverage
      - web
      - build-vsix
      - build-node-package

    steps:
      - name: Verify required jobs succeeded
        shell: bash
        run: |
          set -euo pipefail
          statuses=(
            "lint=${{ needs.lint.result }}"
            "typecheck=${{ needs.typecheck.result }}"
            "rust=${{ needs.rust.result }}"
            "coverage=${{ needs.coverage.result }}"
            "web=${{ needs.web.result }}"
            "build-vsix=${{ needs['build-vsix'].result }}"
            "build-node-package=${{ needs['build-node-package'].result }}"
          )
          failed=()
          for status in "${statuses[@]}"; do
            if [[ "${status#*=}" != "success" ]]; then
              failed+=("$status")
            fi
          done
          if (( ${#failed[@]} > 0 )); then
            printf 'Required jobs did not succeed:\n'
            printf '  %s\n' "${failed[@]}"
            exit 1
          fi
          echo 'All required jobs succeeded'
